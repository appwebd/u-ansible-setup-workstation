---
# Role        : configure_secure_icmp_redirects
# Description : Ensure secure ICMP redirects are disabled.
# Wazuh ID    : 35613
# Scope       : Debian/Ubuntu family | Disable secure ICMP redirect acceptance

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure sysctl.d directory exists"
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: "Write sysctl configuration file for secure ICMP redirects"
  become: true
  ansible.builtin.template:
    src: 60-secure-icmp-redirects.conf.j2
    dest: "{{ sysctl_config_file }}"
    owner: root
    group: root
    mode: "0644"
    force: true
    backup: true
  notify: Reload sysctl settings

- name: "Apply sysctl parameters immediately"
  ansible.builtin.command: >
    sh -c 'sysctl -w net.ipv4.conf.all.secure_redirects=0 &&
           sysctl -w net.ipv4.conf.default.secure_redirects=0 &&
           sysctl -w net.ipv4.route.flush=1'
  changed_when: true
  failed_when: false

- name: "Verify secure ICMP redirect settings are applied"
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.conf.all.secure_redirects net.ipv4.conf.default.secure_redirects
  register: sysctl_output_raw
  changed_when: false
  check_mode: false

- name: "Report current sysctl values for secure redirects"
  ansible.builtin.debug:
    msg: |
      Current sysctl settings:
      {% if sysctl_output_raw.stdout | length > 0 %}
        net.ipv4.conf.all.secure_redirects = {{ (sysctl_output_raw.stdout_lines[0] | default('N/A')).strip() }}
        net.ipv4.conf.default.secure_redirects = {{ (sysctl_output_raw.stdout_lines[1] | default('N/A')).strip() }}
      {% else %}
        [INFO] Sysctl parameters not found. This may occur if:
              - Kernel doesn't support these options
              - Parameters are not exposed via sysfs in this environment (e.g., containers)
      {% endif %}
