---
# Role        : disable_xdmcp
# Description : Ensure XDMCP is not enabled in GDM3
# Wazuh ID    : 35560

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure default GDM3 paths"
  ansible.builtin.set_fact:
    xdmcp_gdm3_config_dir: "{{ xdmcp_gdm3_config_dir | default('/etc/gdm3') }}"
    xdmcp_gdm3_custom_conf: "{{ xdmcp_gdm3_custom_conf | default('/etc/gdm3/custom.conf') }}"

- name: "Pre-check: Verify GDM3 configuration directory exists"
  ansible.builtin.stat:
    path: /etc/gdm3
  register: gdm3_dir_check
  changed_when: false

# Only run if GDM3 directory exists AND OS is Debian-family
- name: "Ensure XDMCP is disabled in GDM3 (only if GDM3 is installed)"
  when:
    - ansible_facts.os_family == 'Debian'
    - gdm3_dir_check.stat.exists
  block:
    - name: "Create or update /etc/gdm3/custom.conf to disable XDMCP"
      ansible.builtin.copy:
        dest: /etc/gdm3/custom.conf
        content: |
          # GDM configuration storage
          # Managed by Ansible (Wazuh ID 35560)
          # Generated: {{ lookup('pipe', 'date "+%Y-%m-%d_%H:%M:%S"') }}
          [daemon]
          #WaylandEnable=false
          [security]
          [xdmcp]
          # Enable=false is NOT set — XDMCP remains disabled by default (Wazuh 35560)
          [chooser]
          [debug]
        owner: root
        group: root
        mode: '0644'
        backup: true
      register: custom_conf_result

    - name: "Ensure [xdmcp] section exists in custom.conf"
      ansible.builtin.lineinfile:
        path: /etc/gdm3/custom.conf
        regexp: '^\[xdmcp\]$'
        line: '[xdmcp]'
        insertafter: 'EOF'
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: "Ensure Enable=true is commented out or removed in [xdmcp] section"
      ansible.builtin.lineinfile:
        path: /etc/gdm3/custom.conf
        regexp: '^\s*Enable\s*=\s*true\s*$'
        line: '# Enable=true'
        state: present
        owner: root
        group: root
        mode: '0644'
        backrefs: true

    - name: "Verify XDMCP is disabled (no active Enable=true)"
      ansible.builtin.shell: |
        grep -E '^\s*Enable\s*=\s*true\s*$' /etc/gdm3/custom.conf || true
      register: xdmcp_enabled_check
      changed_when: false
      failed_when: xdmcp_enabled_check.stdout | length > 0

# Optional: Notify user if GDM3 is not installed (non-fatal)
- name: "Notify that XDMCP was skipped due to missing GDM3"
  ansible.builtin.debug:
    msg: "Skipped XDMCP configuration: /etc/gdm3 directory does not exist."
  when: not gdm3_dir_check.stat.exists and ansible_facts.os_family == 'Debian'
