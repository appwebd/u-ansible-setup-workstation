---
# Role       : remove_unused_accounts_groups
# Description: Remove unused accounts and groups

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: Remove specifics accounts with homes folder
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: "{{ remove_unused_accounts_groups_user_remove_options.remove_home | bool }}"
    force: "{{ remove_unused_accounts_groups_user_remove_options.force | bool }}"
  loop: "{{ remove_unused_accounts_groups_users_to_remove }}"
  become: true

- name: Remove accounts optionals additional
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: "{{ remove_unused_accounts_groups_user_remove_options.remove_home | bool }}"
    force: "{{ remove_unused_accounts_groups_user_remove_options.force | bool }}"
  loop: "{{ remove_unused_accounts_groups_additional_users }}"
  become: true

- name: Remove groups (if this exists)
  ansible.builtin.group:
    name: "{{ item }}"
    state: absent
  loop: "{{ remove_unused_accounts_groups_users_to_remove }}"
  become: true
