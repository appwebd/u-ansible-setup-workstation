---
# Role        : configure_passwd_permissions
# Description : Ensure permissions on /etc/passwd are configured
# Wazuh ID    : 35761

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure /etc/passwd has correct ownership (owner: root, group: root)"
  ansible.builtin.file:
    path: "{{ passwd_file_path }}"
    owner: "{{ passwd_owner }}"
    group: "{{ passwd_group }}"
    mode: "{{ passwd_mode }}"

- name: "Ensure /etc/passwd permissions do not include world/other write or execute"
  ansible.builtin.file:
    path: "{{ passwd_file_path }}"
    mode: "u=rw,go=r"
  register: chmod_result
  failed_when:
    - chmod_result.failed and "No such file or directory" not in chmod_result.msg | default("")
  notify: Verify passwd permissions
