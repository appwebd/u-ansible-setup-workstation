---
# Role        : configure_local_login_banner
# Description : Ensure local login warning banner is configured properly
# Wazuh ID    : 35547

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure /etc/issue directory exists"
  ansible.builtin.file:
    path: "/etc"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Configure /etc/issue warning banner"
  ansible.builtin.copy:
    content: "{{ issue_banner_text }}"
    dest: "{{ issue_file_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Refresh login banners
