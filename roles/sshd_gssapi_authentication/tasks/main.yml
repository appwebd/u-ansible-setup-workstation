---
# Role        : sshd_gssapi_authentication
# Description : Ensure sshd GSSAPIAuthentication is disabled
# Wazuh ID    : 35648

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure GSSAPIAuthentication is disabled in sshd_config"
  ansible.builtin.lineinfile:
    path: "{{ sshd_config_file }}"
    regexp: "^#*\\s*{{ sshd_gssapi_option }}\\s+.*"
    line: "{{ sshd_gssapi_option }} {{ sshd_gssapi_value }}"
    state: present
    owner: root
    group: root
    mode: "0644"
    backrefs: true
    create: true
  notify: Restart sshd

- name: "Verify GSSAPIAuthentication is disabled"
  ansible.builtin.command: sshd -T
  register: sshd_config_test
  changed_when: false
  failed_when: "'gssapiauthentication yes' in sshd_config_test.stdout.lower()"
  check_mode: false
