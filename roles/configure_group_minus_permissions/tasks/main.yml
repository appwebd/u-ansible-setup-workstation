---
# Role        : configure_group_minus_permissions
# Description : Ensure permissions on /etc/group- are configured
# Wazuh ID    : 35764

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Check if /etc/group- exists"
  ansible.builtin.stat:
    path: "{{ group_backup_file }}"
  register: file_stat

- name: "Debug variable check file exists"
  ansible.builtin.debug:
    msg: "debug variable if /etc/issue exists value : {{ file_stat }}"
  changed_when: false

- name: "Ensure /etc/group- has correct ownership and permissions (u-x,go-wx)"
  ansible.builtin.file:
    path: "{{ group_backup_file }}"
    owner: "{{ group_backup_file_owner }}"
    group: "{{ group_backup_file_group }}"
    mode: "{{ group_backup_file_mode }}"
  when: file_stat.stat.exists
