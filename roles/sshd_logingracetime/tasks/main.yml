---
# Role        : sshd_logingracetime
# Description : Ensure sshd LoginGraceTime is configured
# Wazuh ID    : 35652

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure LoginGraceTime is configured in sshd_config"
  ansible.builtin.lineinfile:
    path: "{{ sshd_config_file }}"
    regexp: '^\s*#?\s*[Ll]ogin[Gg]race[Tt]ime\s.*'
    line: "LoginGraceTime {{ sshd_logingracetime_value }}"
    state: present
    owner: root
    group: root
    mode: "0644"
    backrefs: true
    insertafter: EOF
  notify: Restart sshd

- name: "Ensure LoginGraceTime value is within acceptable range (1-60 seconds)"
  ansible.builtin.assert:
    that:
      - sshd_logingracetime_value | int >= 1
      - sshd_logingracetime_value | int <= 60
    fail_msg: "LoginGraceTime must be between 1 and 60 seconds"
    success_msg: "LoginGraceTime value is within acceptable range"
  run_once: true
  delegate_to: localhost
