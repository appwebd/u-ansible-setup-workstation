---
# Role        : configure_cron_weekly_permissions
# Description : Ensure permissions on /etc/cron.weekly are configured.
# Wazuh ID    : 35597

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Ensure /etc/cron.weekly directory exists"
  ansible.builtin.file:
    path: "{{ cron_weekly_dir }}"
    state: directory
    owner: "{{ cron_weekly_permissions.owner }}"
    group: "{{ cron_weekly_permissions.group }}"
    mode: "{{ cron_weekly_permissions.mode }}"
