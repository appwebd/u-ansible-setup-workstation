---
# Role        : disable_overlayfs
# Description : Ensure overlay filesystem is disabled.
# Wazuh ID    : 35505
# Scope       : Debian/Ubuntu family | Disable overlay module at boot and unload if loaded

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Check if overlay module is currently loaded"
  ansible.builtin.shell: |
    set -euo pipefail
    lsmod | grep -q "^overlay" || lsmod | grep -q "^overlayfs"
  register: overlay_loaded_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Ensure overlay modules are blacklisted in modprobe configuration"
  ansible.builtin.template:
    src: disable-overlay.conf.j2
    dest: "{{ disable_overlayfs_blacklist_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: disable_overlayfs_enabled | bool

# Install module community.general.modprobe using: ansible-galaxy collection install community.general
- name: "Remove overlay module if currently loaded"
  community.general.modprobe:
    name: "{{ overlay_module_name }}"
    state: absent
  when:
    - overlay_unload_if_loaded | bool
    - overlay_loaded_check.rc == 0

- name: "Ensure overlay modules are not loaded on next boot (remove from /etc/modules)"
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/disable-overlay.conf
    line: "{{ item }}"
    state: absent
    backup: true
  loop: "{{ disable_overlayfs_modules }}"
  when: disable_overlayfs_enabled | bool

- name: "Ensure overlay modules are blacklisted in modprobe configuration (idempotent)"
  ansible.builtin.lineinfile:
    path: "{{ disable_overlayfs_blacklist_file }}"
    line: "blacklist {{ item }}"
    state: present
    create: true
    mode: "0644"
  loop: "{{ disable_overlayfs_modules }}"
  when: disable_overlayfs_enabled | bool
  notify: Update initramfs


- name: Verify overlayfs is disabled (blacklisted and not loaded)
  when: disable_overlayfs_enabled | default(false) | bool
  block:

    # Step 1: Check if the overlay is blacklisted
    - name: "Verify overlay modules are blacklisted"
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^\s*blacklist\s+(overlay|overlayfs)\s*$' {{ disable_overlayfs_blacklist_file }}
      register: blacklist_verify_result
      changed_when: false
      failed_when: false


    # Step 2: Check that it's not currently loaded into memory
    - name: "Check if overlay module is currently loaded"
      ansible.builtin.shell: |
        set -euo pipefail
        lsmod | grep -q "^overlay" || lsmod | grep -q "^overlayfs"
      register: overlay_mod_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    # (Optional) You can also use lsmod to check status in runtime:
    - name: Check overlay module is not loaded via lsmod
      ansible.builtin.command: lsmod | grep -q '^overlay'
      register: overlay_lsmod
      changed_when: false
      failed_when: false

    - name: Report compliance status for overlay filesystem
      ansible.builtin.debug:
        msg: >-
          {% if not disable_overlayfs_enabled | bool %}
            Overlay filesystem is compliant (disabled via config)
          {% elif blacklist_check.results | map(attribute='matched') | sum == 0 %}
            Non-compliant: no blacklist entry found for 'overlay'
          {% elif overlay_lsmod.rc == 0 or overlay_mod_loaded.rc == 0 %}
            Non-compliant: overlay module loaded despite blacklisting
          {% else %}
            Compliant: overlay is blacklisted and not loaded.
          {% endif %}

    # (Optional) Force failure if not compliant
    - name: Fail if non-compliant
      ansible.builtin.fail:
        msg: "Overlay filesystem must be disabled for security compliance"
      when:
        disable_overlayfs_enabled | bool or
        blacklist_check.results | map(attribute='matched') | sum == 0 or
        overlay_lsmod.rc == 0 or
        overlay_mod_loaded.rc == 0

  rescue:
    - name: Handle failures gracefully
      ansible.builtin.debug:
        msg: "Compliance check for overlay filesystem failed"
