---
# defaults/main.yml
# Default variables for the disable_udf role
# These values can be overridden by inventory or playbook variables

udf_enabled: false
udf_modprobe_conf_file: /etc/modprobe.d/udf.conf
udf_blacklist_content: |
  #
  # Role        : disable_udf
  # Description : Ensure udf kernel module is not available.
  # Wazuh ID    : 35507
  # Generated   : {{ lookup('pipe', 'date "+%Y-%m-%d_%H:%M:%S"') }}
  #
  install udf /bin/false
  blacklist udf
