---
# Role        : configure_etc_issue_net_access
# Description : Ensure access to /etc/issue.net is configured.
# Wazuh ID    : 35551

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Check if /etc/issue.net exists"
  ansible.builtin.stat:
    path: "{{ issue_net_path }}"
  register: issue_net_stat

- name: "Debug variable issue_net_stat"
  ansible.builtin.debug:
    msg: "debug variable if /etc/issue.net exists : {{ issue_net_stat }}"
  changed_when: false

- name: "Ensure access to /etc/issue.net is configured."
  ansible.builtin.file:
    path: "{{ issue_net_path }}"
    mode: '0640'                                       # chmod u-x,go-rwx /etc/issue.net
    owner: root                                        # chmod root:root /etc/issue.net
    group: root
    state: file
  when: issue_net_stat.stat.exists
