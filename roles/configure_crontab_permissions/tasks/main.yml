---
# Role        : configure_crontab_permissions
# Description : Ensure permissions on /etc/crontab are configured (Wazuh ID 35594)
# Wazuh ID    : 35594

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Check if /etc/crontab exists"
  ansible.builtin.stat:
    path: "{{ crontab_file_path }}"
  register: crontab_file_check
  changed_when: false

- name: "Ensure /etc/crontab ownership and permissions are configured"
  ansible.builtin.file:
    path: "{{ crontab_file_path }}"
    owner: "{{ crontab_owner }}"
    group: "{{ crontab_group }}"
    mode: "{{ crontab_mode }}"
  when: crontab_file_check.stat.exists
