---
# Role        : update_pam
# Description : Ensure latest version of pam is installed
# Wazuh ID    : 35669

- name: "Verify operating system is Debian/Ubuntu (apt-based)"
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'Ubuntu']
    fail_msg: >
      CRITICAL: This role only supports Debian/Ubuntu-based systems.
      Execution will STOP on this host because the OS family is not 'Debian'.
      Current value: {{ ansible_os_family | default('UNKNOWN') }}
    success_msg: "OS family verified as Debian or Ubuntu."

- name: "Update apt cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Ensure latest version of libpam-runtime is installed
  ansible.builtin.apt:
    name: "{{ pam_package_name }}"
    state: latest
    update_cache: true
    cache_valid_time: 3600
    autoremove: false
    purge: false
  tags:
    - patching
  # Compliance requirement: ensure most recent version of the package
  # noqa: package-latest

- name: "Update PAM packages"
  ansible.builtin.apt:
    name: "{{ pam_package_name }}"
    state: present
  when: pam_update_enabled | default(true)
  tags: [patching, pam]
  # noqa: package-latest

- name: "Verify libpam-runtime is installed and configured correctly"
  ansible.builtin.command: dpkg-query -s libpam-runtime
  register: dpkg_query_result
  changed_when: false
  failed_when: >
    dpkg_query_result.rc != 0 or
    'Status: install ok installed' not in dpkg_query_result.stdout
